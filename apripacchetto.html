<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apri Pacchetto - TeenagersITA</title>
<link rel="icon" href="teenagersitalogo2.png">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background-color: #07152b;
    background-image: linear-gradient(rgba(3, 10, 22, 0.75), rgba(7, 21, 43, 0.85)), url('sfondo2.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; text-align: center; padding: 36px 20px; }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(1.8rem, 7vw, 2.8rem);
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 0 14px rgba(90,180,255,.9), 0 2px 4px rgba(0,0,0,.8);
  }
  header p { margin: 0 0 22px; color: #bcd9f7; font-size: 1.1rem; }

  .btn {
    display: inline-block;
    min-height: 48px;
    padding: 12px 28px;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0,20,60,.9);
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 16px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
    cursor: pointer;
  }

  .btn:active { filter: brightness(.9); }
  .btn:focus-visible, a:focus-visible { outline: 3px solid #8fd0ff; outline-offset: 2px; }

  h2 { margin: 0 0 14px; font-size: 1.4rem; color: #fff; text-shadow: 0 0 8px rgba(90,180,255,.6); text-align: center; }

  /* Sezione Pacchetti */
  .packs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
    justify-items: center;
    margin-top: 20px;
  }

  .pack-item {
    background: rgba(5,20,45,.65);
    border: 1px solid rgba(120,185,255,.35);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    width: 100%;
  }

  .pack-item:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 8px 24px rgba(80,170,255,.4);
  }

  .pack-img {
    width: 100%;
    max-width: 160px;
    height: auto;
    border-radius: 10px;
    margin-bottom: 12px;
  }

  /* Sezione Carte Trovate */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 16px;
    justify-items: center;
    margin-top: 20px;
  }

  .card-item {
    background: rgba(5,20,45,.65);
    border: 1px solid rgba(120,185,255,.35);
    border-radius: 14px;
    padding: 10px;
    text-align: center;
    animation: fadeIn 0.4s ease-in-out;
    width: 100%;
  }

  .card-img {
    width: 100%;
    max-width: 140px;
    height: auto;
    border-radius: 10px;
    border: 1px solid rgba(140,200,255,.3);
  }

  .controls {
    text-align: center;
    margin-top: 24px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  footer { text-align: center; color: #8fb4dc; font-size: .9rem; padding: 10px 0 40px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <h1>Spacchettamento</h1>
    <p>Scegli uno dei pacchetti per trovare 5 carte casuali!</p>
    <div>
      <a class="btn" href="index.html">Torna alla Home</a>
    </div>
  </header>

  <main class="glass">
    <h2 id="section-title">Scegli un Pacchetto</h2>
    
    <!-- Griglia dei Pacchetti con copertinapacchetto.png -->
    <div id="packs-container" class="packs-grid">
      <div class="pack-item" onclick="openPack()">
        <img class="pack-img" src="copertinapacchetto.png" alt="Pacchetto Carte">
        <h3>Pacchetto #1</h3>
      </div>
      <div class="pack-item" onclick="openPack()">
        <img class="pack-img" src="copertinapacchetto.png" alt="Pacchetto Carte">
        <h3>Pacchetto #2</h3>
      </div>
      <div class="pack-item" onclick="openPack()">
        <img class="pack-img" src="copertinapacchetto.png" alt="Pacchetto Carte">
        <h3>Pacchetto #3</h3>
      </div>
    </div>

    <!-- Griglia delle Carte estratte (nascosta all'inizio) -->
    <div id="cards-container" class="cards-grid" style="display: none;"></div>

    <!-- Pulsante per aprire un altro pacchetto (nascosto all'inizio) -->
    <div id="controls" class="controls" style="display: none;">
      <button class="btn" onclick="resetPacks()">Aprine un altro</button>
    </div>
  </main>

  <footer>Carte TeenagersITA · Progetto non ufficiale</footer>

</div>

<script>
  // Lista completa di tutte le carte disponibili nel mazzo
  const availableCards = [
    { name: "Brandix", img: "brandix.png" },
    { name: "Clipp3r", img: "clipp3r.png" },
    { name: "Aspro", img: "aspro.png" },
    { name: "Fronte", img: "Fronte.png" },
    { name: "Bho76", img: "bho76.png" },
    { name: "Aliexpress", img: "aliex.png" },
    { name: "Elonmuskiosa", img: "elonmuskiosa.png" },
    { name: "Frontealpino", img: "frontealpino.png" }
  ];

  function openPack() {
    // Nascondi i pacchetti e aggiorna il titolo
    document.getElementById("packs-container").style.display = "none";
    document.getElementById("section-title").textContent = "Le tue 5 Carte Trovate!";

    const cardsContainer = document.getElementById("cards-container");
    cardsContainer.innerHTML = "";
    cardsContainer.style.display = "grid";

    // Estrai 5 carte casuali
    for (let i = 0; i < 5; i++) {
      const randomIndex = Math.floor(Math.random() * availableCards.length);
      const card = availableCards[randomIndex];

      const cardElement = document.createElement("div");
      cardElement.className = "card-item";
      cardElement.innerHTML = `
        <img class="card-img" src="${card.img}" alt="${card.name}">
        <p style="margin-top: 6px; margin-bottom: 0; color: #fff; font-weight: 600;">${card.name}</p>
      `;
      cardsContainer.appendChild(cardElement);
    }

    // Mostra il pulsante "Aprine un altro"
    document.getElementById("controls").style.display = "block";
  }

  function resetPacks() {
    // Ripristina la visualizzazione iniziale dei pacchetti
    document.getElementById("cards-container").style.display = "none";
    document.getElementById("controls").style.display = "none";
    document.getElementById("packs-container").style.display = "grid";
    document.getElementById("section-title").textContent = "Scegli un Pacchetto";
  }
</script>
</body>
</html>
