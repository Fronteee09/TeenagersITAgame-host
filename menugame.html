<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu Gioco - TeenagersITA</title>
<link rel="icon" href="teenagersitalogo2.png">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background-color: #07152b;
    background-image: linear-gradient(rgba(3, 10, 22, 0.75), rgba(7, 21, 43, 0.85)), url('sfondo2.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .fullscreen-box {
    position: relative;
    width: 100%;
    max-width: 520px;
    min-height: auto;
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,.7), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    padding: 36px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  /* Tastino torna alla home in alto a destra */
  .home-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #fff;
    text-decoration: none;
    background: rgba(5, 20, 45, 0.65);
    border: 1px solid rgba(140,200,255,0.4);
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: all 0.2s ease;
  }

  .home-btn:active {
    transform: scale(0.95);
  }

  h1 {
    margin: 10px 0 6px;
    font-size: clamp(2rem, 8vw, 2.8rem);
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 0 14px rgba(90,180,255,.9), 0 2px 4px rgba(0,0,0,.8);
  }

  p {
    margin: 0 0 28px;
    color: #bcd9f7;
    font-size: 1.05rem;
  }

  .btn-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 320px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 52px;
    padding: 12px 24px;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0,20,60,.9);
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 16px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  .btn:active {
    transform: scale(0.97);
    filter: brightness(.9);
  }

  .btn:focus-visible, a:focus-visible {
    outline: 3px solid #8fd0ff;
    outline-offset: 2px;
  }

  footer-tag {
    margin-top: 28px;
    font-size: 0.85rem;
    color: #8fb4dc;
  }
</style>
</head>
<body>

<div class="fullscreen-box">
  <!-- Tasto per tornare alla Home -->
  <a class="home-btn" href="index.html">🏠 Home</a>

  <h1>Sala Giochi</h1>
  <p>Scegli come desideri sfidare gli avversari:</p>

  <div class="btn-group">
    <a class="btn" href="twoplayer.html">Due Giocatori</a>
    <a class="btn" href="vsbot.html">Contro il Bot</a>
  </div>

  <div class="footer-tag">Carte TeenagersITA · Progetto ufficiale</div>
</div>

</body>
</html>
