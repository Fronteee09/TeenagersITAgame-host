<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annunci e Post - TeenagersITA</title>
<link rel="icon" href="teenagersitalogo2.png">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background-color: #07152b;
    background-image: linear-gradient(rgba(3, 10, 22, 0.75), rgba(7, 21, 43, 0.85)), url('sfondo2.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; text-align: center; padding: 36px 20px; }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(1.8rem, 7vw, 2.8rem);
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 0 14px rgba(90,180,255,.9), 0 2px 4px rgba(0,0,0,.8);
  }
  header p { margin: 0 0 22px; color: #bcd9f7; font-size: 1.1rem; }

  .header-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    min-height: 48px;
    padding: 12px 28px;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0,20,60,.9);
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 16px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
    cursor: pointer;
    font-size: 0.95rem;
  }

  .btn:active { filter: brightness(.9); }
  .btn-secondary {
    background: linear-gradient(180deg, rgba(80,160,255,0.3) 0%, rgba(20,60,120,0.5) 100%);
    border: 1px solid rgba(140,200,255,0.4);
    box-shadow: none;
  }

  .btn-like {
    min-height: 40px;
    padding: 8px 16px;
    font-size: 1.1rem;
    margin-top: 10px;
    background: linear-gradient(180deg, rgba(80,160,255,0.4) 0%, rgba(20,60,120,0.6) 100%);
    border: 1px solid rgba(140,200,255,0.5);
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-like.liked {
    background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    border-color: #60a5fa;
    box-shadow: 0 0 16px rgba(59,130,246,0.6), inset 0 1px 0 rgba(255,255,255,0.7);
  }

  /* ADMIN PANEL */
  .admin-panel {
    border-color: #60a5fa;
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
  }

  .admin-panel h2 { color: #93c5fd; margin-bottom: 12px; }

  .admin-input, .admin-textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    background: rgba(3, 10, 22, 0.75);
    border: 1px solid rgba(140, 200, 255, 0.4);
    border-radius: 10px;
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
  }

  .admin-input:focus, .admin-textarea:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 8px rgba(96, 165, 250, 0.5);
  }

  .admin-textarea { height: 120px; resize: vertical; }

  h2 { margin: 0 0 4px; font-size: 1.4rem; color: #fff; text-shadow: 0 0 8px rgba(90,180,255,.6); }
  .post-info { font-size: 0.85rem; color: #8fb4dc; margin-bottom: 12px; display: block; }
  p { margin: 0 0 10px; color: #bcd9f7; }

  .post-img {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid rgba(140,200,255,.3);
    margin-bottom: 14px;
  }

  /* MODALE AUTH */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(3, 10, 22, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
  }

  .modal-card { width: 100%; max-width: 420px; position: relative; }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 18px;
    background: none;
    border: none;
    color: #8fb4dc;
    font-size: 1.5rem;
    cursor: pointer;
  }
  .modal-close:hover { color: #fff; }

  .tabs {
    display: flex;
    margin-bottom: 16px;
    border-bottom: 1px solid rgba(140,200,255,0.3);
  }

  .tab-btn {
    flex: 1;
    padding: 10px;
    background: none;
    border: none;
    color: #8fb4dc;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .tab-btn.active { color: #fff; border-bottom-color: #60a5fa; }

  .hidden { display: none !important; }
  footer { text-align: center; color: #8fb4dc; font-size: .9rem; padding: 10px 0 40px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <h1>Annunci e Post</h1>
    <p>Tutti gli aggiornamenti sul progetto TeenagersITA</p>
    <div class="header-buttons">
      <a class="btn" href="index.html">Torna alla Home</a>
      <button id="auth-btn" class="btn btn-secondary" onclick="openModal('login')">Accedi / Registrati</button>
    </div>
  </header>

  <!-- PANNELLO ADMIN (Visibile solo all'UID Admin specificato) -->
  <div id="admin-panel" class="glass admin-panel hidden">
    <h2>✍️ Pubblica un nuovo Annuncio</h2>
    <input type="text" id="post-title" class="admin-input" placeholder="Titolo del post...">
    <input type="text" id="post-img-url" class="admin-input" placeholder="URL Immagine (opzionale)">
    <textarea id="post-text" class="admin-textarea" placeholder="Scrivi il contenuto dell'annuncio..."></textarea>
    <button class="btn" onclick="publishPost()">Pubblica Post</button>
  </div>

  <!-- POSTS CONTAINER -->
  <div id="posts-container">
    <p style="text-align: center; color: #bcd9f7;">Caricamento post in corso...</p>
  </div>

  <footer>Carte TeenagersITA · Progetto NON ufficiale</footer>

</div>

<!-- MODALE NICKNAME & PASSWORD -->
<div id="auth-modal" class="modal-overlay hidden">
  <div class="glass modal-card">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchAuthMode('login')">Accedi</button>
      <button class="tab-btn" id="tab-register" onclick="switchAuthMode('register')">Registrati</button>
    </div>

    <form onsubmit="handleAuthSubmit(event)">
      <input type="text" id="auth-nickname" class="admin-input" placeholder="Il tuo Nickname (es. Fronte)" required autocomplete="username">
      <input type="password" id="auth-password" class="admin-input" placeholder="Password (min. 6 caratteri)" required autocomplete="current-password">
      
      <button type="submit" id="auth-submit-btn" class="btn" style="width: 100%; margin-top: 8px;">Accedi</button>
    </form>
    
    <p id="auth-error" style="color: #f87171; font-size: 0.85rem; margin-top: 14px; text-align: center; margin-bottom: 0;"></p>
  </div>
</div>

<!-- FIREBASE SCRIPT -->

  const firebaseConfig = {

    authDomain: "teenagersita-cards.firebaseapp.com",
    projectId: "teenagersita-cards",
    storageBucket: "teenagersita-cards.firebasestorage.app",
    messagingSenderId: "651917703980",
    appId: "1:651917703980:web:d4c8f87b4645e97c46ca89",
    measurementId: "G-84P57RTZEV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // UID AMMINISTRATORE RIPRISTINATO
  const ADMIN_UID = "LRS2V4mx1kOKGZl65J1DYzqRX9q1"; 

  let currentUser = null;
  let authMode = 'login'; // 'login' o 'register'

  // Gestione stato Auth in tempo reale
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    const authBtn = document.getElementById('auth-btn');
    const adminPanel = document.getElementById('admin-panel');

    if (user) {
      let displayName = user.email ? user.email.split('@')[0] : "Utente";
      
      if (user.uid === ADMIN_UID) {
        authBtn.innerText = "Esci (" + displayName + " ★)";
        adminPanel.classList.remove('hidden');
      } else {
        authBtn.innerText = "Esci (" + displayName + ")";
        adminPanel.classList.add('hidden');
      }
      authBtn.onclick = handleLogout;
    } else {
      authBtn.innerText = "Accedi / Registrati";
      authBtn.onclick = () => openModal('login');
      adminPanel.classList.add('hidden');
    }
  });

  window.openModal = function(mode) {
    authMode = mode;
    document.getElementById('auth-error').innerText = "";
    document.getElementById('auth-nickname').value = "";
    document.getElementById('auth-password').value = "";
    
    const tabLogin = document.getElementById('tab-login');
