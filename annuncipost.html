<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annunci e Post - TeenagersITA</title>
<link rel="icon" href="teenagersitalogo2.png">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background-color: #07152b;
    background-image: linear-gradient(rgba(3, 10, 22, 0.75), rgba(7, 21, 43, 0.85)), url('sfondo2.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; text-align: center; padding: 36px 20px; }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(1.8rem, 7vw, 2.8rem);
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 0 14px rgba(90,180,255,.9), 0 2px 4px rgba(0,0,0,.8);
  }
  header p { margin: 0 0 22px; color: #bcd9f7; font-size: 1.1rem; }

  .header-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    min-height: 48px;
    padding: 12px 28px;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0,20,60,.9);
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 16px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
    cursor: pointer;
  }

  .btn:active { filter: brightness(.9); }
  .btn:focus-visible, a:focus-visible { outline: 3px solid #8fd0ff; outline-offset: 2px; }

  .btn-like {
    min-height: 40px;
    padding: 8px 16px;
    font-size: 1.2rem;
    margin-top: 10px;
    background: linear-gradient(180deg, rgba(80,160,255,0.4) 0%, rgba(20,60,120,0.6) 100%);
    border: 1px solid rgba(140,200,255,0.5);
    transition: all 0.2s ease;
  }

  .btn-like.liked {
    background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    border-color: #60a5fa;
    box-shadow: 0 0 16px rgba(59,130,246,0.6), inset 0 1px 0 rgba(255,255,255,0.7);
  }

  /* STILI PANNELLO ADMIN CREAZIONE POST */
  .admin-panel {
    border-color: #60a5fa;
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
  }

  .admin-panel h2 {
    color: #93c5fd;
    margin-bottom: 12px;
  }

  .admin-input, .admin-textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    background: rgba(3, 10, 22, 0.7);
    border: 1px solid rgba(140, 200, 255, 0.4);
    border-radius: 10px;
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
  }

  .admin-input:focus, .admin-textarea:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 8px rgba(96, 165, 250, 0.5);
  }

  .admin-textarea {
    height: 120px;
    resize: vertical;
  }

  h2 { margin: 0 0 4px; font-size: 1.4rem; color: #fff; text-shadow: 0 0 8px rgba(90,180,255,.6); }
  .post-info { font-size: 0.85rem; color: #8fb4dc; margin-bottom: 12px; display: block; }
  p { margin: 0 0 10px; color: #bcd9f7; }

  .post-img {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid rgba(140,200,255,.3);
    margin-bottom: 14px;
  }

  .hidden { display: none !important; }

  footer { text-align: center; color: #8fb4dc; font-size: .9rem; padding: 10px 0 40px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <h1>Annunci e Post</h1>
    <p>Tutti gli aggiornamenti sul progetto TeenagersITA</p>
    <div class="header-buttons">
      <a class="btn" href="index.html">Torna alla Home</a>
      <button id="auth-btn" class="btn" onclick="handleAuthAction()">Accedi Admin</button>
    </div>
  </header>

  <!-- FORM PUBBLICAZIONE (Nascosto di default, visibile solo a te) -->
  <div id="admin-panel" class="glass admin-panel hidden">
    <h2>✍️ Pubblica un nuovo Annuncio</h2>
    <input type="text" id="post-title" class="admin-input" placeholder="Titolo del post...">
    <input type="text" id="post-img-url" class="admin-input" placeholder="Nome o URL Immagine (es. copertinalivelliupdate1.png) - Opzionale">
    <textarea id="post-text" class="admin-textarea" placeholder="Scrivi il contenuto dell'annuncio..."></textarea>
    <button class="btn" onclick="publishPost()">Pubblica Post</button>
  </div>

  <!-- CONTENITORE DINAMICO DEI POST -->
  <div id="posts-container">
    <p style="text-align: center; color: #bcd9f7;">Caricamento post in corso...</p>
  </div>

  <footer>Carte TeenagersITA · Progetto NON ufficiale</footer>

</div>

<!-- FIREBASE SCRIPT -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    onSnapshot, 
    query, 
    orderBy 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCCqjJNoMeliQskPzlMAGOqeF_-aFZuksY",
    authDomain: "teenagersita-cards.firebaseapp.com",
    projectId: "teenagersita-cards",
    storageBucket: "teenagersita-cards.firebasestorage.app",
    messagingSenderId: "651917703980",
    appId: "1:651917703980:web:d4c8f87b4645e97c46ca89",
    measurementId: "G-84P57RTZEV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Inserisci qui il tuo UID preso dalla scheda Authentication di Firebase
  const ADMIN_UID = "IL_TUO_UID_DI_FIREBASE"; 

  let currentUser = null;

  // Controllo Autenticazione
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    const authBtn = document.getElementById('auth-btn');
    const adminPanel = document.getElementById('admin-panel');

    if (user) {
      authBtn.innerText = "Esci";
      // Mostra il pannello di pubblicazione solo se l'UID corrisponde a Fronte
      if (user.uid === ADMIN_UID) {
        adminPanel.classList.remove('hidden');
      } else {
        adminPanel.classList.add('hidden');
      }
    } else {
      authBtn.innerText = "Accedi Admin";
      adminPanel.classList.add('hidden');
    }
  });

  // Gestione Bottone Login / Logout
  window.handleAuthAction = function() {
    if (currentUser) {
      signOut(auth);
    } else {
      window.location.href = "account.html";
    }
  };

  // Funzione per creare e pubblicare il post su Firestore
  window.publishPost = async function() {
    const title = document.getElementById('post-title').value.trim();
    const imgUrl = document.getElementById('post-img-url').value.trim();
    const text = document.getElementById('post-text').value.trim();

    if (!title || !text) {
      alert("Inserisci almeno il titolo e il testo del post!");
      return;
    }

    try {
      await addDoc(collection(db, "annunci"), {
        titolo: title,
        immagine: imgUrl || null,
        testo: text,
        autore: "Fronte ★",
        timestamp: new Date()
      });

      // Pulisce i campi di input
      document.getElementById('post-title').value = "";
      document.getElementById('post-img-url').value = "";
      document.getElementById('post-text').value = "";
      
      alert("Post pubblicato con successo!");
    } catch (e) {
      alert("Errore durante la pubblicazione: " + e.message);
    }
  };

  // Carica i post da Firestore mantenendo lo stile Glassmorphism
  function loadPosts() {
    const q = query(collection(db, "annunci"), orderBy("timestamp", "desc"));

    onSnapshot(q, (snapshot) => {
      const container = document.getElementById('posts-container');
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = "<p style='text-align: center; color: #bcd9f7;'>Nessun annuncio presente.</p>";
        return;
      }

      snapshot.docs.forEach((docSnap) => {
        const data = docSnap.data();
        
        // Formattazione data italiana
        let dateStr = "Di recente";
        if (data.timestamp) {
          const d = data.timestamp.toDate();
          dateStr = `Pubblicato il ${d.toLocaleDateString('it-IT')} alle ${d.toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'})}`;
        }

        const article = document.createElement('article');
        article.className = 'glass';

        let imgHTML = data.immagine ? `<img src="${data.immagine}" alt="${data.titolo}" class="post-img">` : '';
        
        // Converte i ritorni a capo (\n) in paragrafi puliti
        const paragraphs = data.testo.split('\n').map(p => `<p>${p}</p>`).join('');

        article.innerHTML = `
          <h2>${data.titolo}</h2>
          <span class="post-info">${dateStr} da <strong>${data.autore || 'Fronte ★'}</strong></span>
          ${imgHTML}
          ${paragraphs}
          <div>
            <button class="btn btn-like" onclick="toggleLike(this)" aria-label="Mi Piace">
              👍
            </button>
          </div>
        `;

        container.appendChild(article);
      });
    });
  }

  window.toggleLike = function(btn) {
    btn.classList.toggle("liked");
  };

  loadPosts();
</script>
</body>
</html>
