<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annunci e Post - TeenagersITA</title>
<link rel="icon" href="teenagersitalogo2.png">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background-color: #07152b;
    background-image: linear-gradient(rgba(3, 10, 22, 0.75), rgba(7, 21, 43, 0.85)), url('sfondo2.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; text-align: center; padding: 36px 20px; }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(1.8rem, 7vw, 2.8rem);
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 0 14px rgba(90,180,255,.9), 0 2px 4px rgba(0,0,0,.8);
  }
  header p { margin: 0 0 22px; color: #bcd9f7; font-size: 1.1rem; }

  .header-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    min-height: 48px;
    padding: 12px 28px;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0,20,60,.9);
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 16px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
    cursor: pointer;
    font-size: 0.95rem;
  }

  .btn:active { filter: brightness(.9); }
  .btn-secondary {
    background: linear-gradient(180deg, rgba(80,160,255,0.3) 0%, rgba(20,60,120,0.5) 100%);
    border: 1px solid rgba(140,200,255,0.4);
    box-shadow: none;
  }

  .btn-like {
    min-height: 40px;
    padding: 8px 16px;
    font-size: 1.1rem;
    margin-top: 10px;
    background: linear-gradient(180deg, rgba(80,160,255,0.4) 0%, rgba(20,60,120,0.6) 100%);
    border: 1px solid rgba(140,200,255,0.5);
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-like.liked {
    background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    border-color: #60a5fa;
    box-shadow: 0 0 16px rgba(59,130,246,0.6), inset 0 1px 0 rgba(255,255,255,0.7);
  }

  /* ADMIN PANEL */
  .admin-panel {
    border-color: #60a5fa;
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
  }

  .admin-panel h2 { color: #93c5fd; margin-bottom: 12px; }

  .admin-input, .admin-textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    background: rgba(3, 10, 22, 0.75);
    border: 1px solid rgba(140, 200, 255, 0.4);
    border-radius: 10px;
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
  }

  .admin-input:focus, .admin-textarea:focus {
    border-color: #60a5fa;
    box-shadow: 0 0 8px rgba(96, 165, 250, 0.5);
  }

  .admin-textarea { height: 120px; resize: vertical; }

  h2 { margin: 0 0 4px; font-size: 1.4rem; color: #fff; text-shadow: 0 0 8px rgba(90,180,255,.6); }
  .post-info { font-size: 0.85rem; color: #8fb4dc; margin-bottom: 12px; display: block; }
  p { margin: 0 0 10px; color: #bcd9f7; }

  .post-img {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid rgba(140,200,255,.3);
    margin-bottom: 14px;
  }

  /* MODALE AUTH */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(3, 10, 22, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
  }

  .modal-card { width: 100%; max-width: 420px; position: relative; }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 18px;
    background: none;
    border: none;
    color: #8fb4dc;
    font-size: 1.5rem;
    cursor: pointer;
  }
  .modal-close:hover { color: #fff; }

  .tabs {
    display: flex;
    margin-bottom: 16px;
    border-bottom: 1px solid rgba(140,200,255,0.3);
  }

  .tab-btn {
    flex: 1;
    padding: 10px;
    background: none;
    border: none;
    color: #8fb4dc;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .tab-btn.active { color: #fff; border-bottom-color: #60a5fa; }

  .hidden { display: none !important; }
  footer { text-align: center; color: #8fb4dc; font-size: .9rem; padding: 10px 0 40px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <h1>Annunci e Post</h1>
    <p>Tutti gli aggiornamenti sul progetto TeenagersITA</p>
    <div class="header-buttons">
      <a class="btn" href="index.html">Torna alla Home</a>
      <button id="auth-btn" class="btn btn-secondary" onclick="openModal('login')">Accedi / Registrati</button>
    </div>
  </header>

  <!-- PANNELLO ADMIN (Visibile solo a te) -->
  <div id="admin-panel" class="glass admin-panel hidden">
    <h2>✍️ Pubblica un nuovo Annuncio</h2>
    <input type="text" id="post-title" class="admin-input" placeholder="Titolo del post...">
    <input type="text" id="post-img-url" class="admin-input" placeholder="URL Immagine (opzionale)">
    <textarea id="post-text" class="admin-textarea" placeholder="Scrivi il contenuto dell'annuncio..."></textarea>
    <button class="btn" onclick="publishPost()">Pubblica Post</button>
  </div>

  <!-- POSTS CONTAINER -->
  <div id="posts-container">
    <p style="text-align: center; color: #bcd9f7;">Caricamento post in corso...</p>
  </div>

  <footer>Carte TeenagersITA · Progetto NON ufficiale</footer>

</div>

<!-- MODALE LOGIN / REGISTRAZIONE -->
<div id="auth-modal" class="modal-overlay hidden">
  <div class="glass modal-card">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchAuthMode('login')">Accedi</button>
      <button class="tab-btn" id="tab-register" onclick="switchAuthMode('register')">Registrati</button>
    </div>

    <form onsubmit="handleAuthSubmit(event)">
      <input type="email" id="auth-email" class="admin-input" placeholder="Email" autocomplete="email" required>
      <input type="password" id="auth-password" class="admin-input" placeholder="Password" autocomplete="current-password" required>
      
      <button type="submit" id="auth-submit-btn" class="btn" style="width: 100%; margin-top: 8px;">Accedi</button>
    </form>
    
    <p id="auth-error" style="color: #f87171; font-size: 0.85rem; margin-top: 14px; text-align: center; margin-bottom: 0;"></p>
  </div>
</div>

<!-- FIREBASE SCRIPT -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    onAuthStateChanged, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword, 
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    doc,
    updateDoc,
    arrayUnion,
    arrayRemove,
    onSnapshot, 
    query, 
    orderBy 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCCqjJNoMeliQskPzlMAGOqeF_-aFZuksY",
    authDomain: "teenagersita-cards.firebaseapp.com",
    projectId: "teenagersita-cards",
    storageBucket: "teenagersita-cards.firebasestorage.app",
    messagingSenderId: "651917703980",
    appId: "1:651917703980:web:d4c8f87b4645e97c46ca89",
    measurementId: "G-84P57RTZEV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const ADMIN_UID = "LRS2V4mx1kOKGZl65J1DYzqRX9q1"; 
  let currentUser = null;
  let authMode = 'login'; // 'login' o 'register'

  // Gestione stato Auth
  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    const authBtn = document.getElementById('auth-btn');
    const adminPanel = document.getElementById('admin-panel');

    if (user) {
      if (user.uid === ADMIN_UID) {
        authBtn.innerText = "Esci (Fronte ★)";
        adminPanel.classList.remove('hidden');
      } else {
        authBtn.innerText = "Esci (" + user.email.split('@')[0] + ")";
        adminPanel.classList.add('hidden');
      }
      authBtn.onclick = handleLogout;
    } else {
      authBtn.innerText = "Accedi / Registrati";
      authBtn.onclick = () => openModal('login');
      adminPanel.classList.add('hidden');
    }
  });

  window.openModal = function(mode) {
    authMode = mode;
    document.getElementById('auth-error').innerText = "";
    document.getElementById('auth-email').value = "";
    document.getElementById('auth-password').value = "";
    
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const submitBtn = document.getElementById('auth-submit-btn');

    if (mode === 'login') {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      submitBtn.innerText = "Accedi";
    } else {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      submitBtn.innerText = "Registrati";
    }

    document.getElementById('auth-modal').classList.remove('hidden');
  };

  window.switchAuthMode = function(mode) {
    authMode = mode;
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const submitBtn = document.getElementById('auth-submit-btn');
    document.getElementById('auth-error').innerText = "";

    if (mode === 'login') {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      submitBtn.innerText = "Accedi";
    } else {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      submitBtn.innerText = "Registrati";
    }
  };

  window.closeModal = function() {
    document.getElementById('auth-modal').classList.add('hidden');
  };

  window.handleAuthSubmit = async function(e) {
    e.preventDefault();
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    const errorMsg = document.getElementById('auth-error');
    errorMsg.innerText = "";

    try {
      if (authMode === 'login') {
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        await createUserWithEmailAndPassword(auth, email, password);
      }
      closeModal();
    } catch (err) {
      if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') {
        errorMsg.innerText = "Email o Password errate.";
      } else if (err.code === 'auth/email-already-in-use') {
        errorMsg.innerText = "Email già registrata.";
      } else if (err.code === 'auth/weak-password') {
        errorMsg.innerText = "La password deve avere almeno 6 caratteri.";
      } else {
        errorMsg.innerText = "Errore: " + err.message;
      }
    }
  };

  window.handleLogout = function() {
    signOut(auth);
  };

  // Pubblica Post (Solo Admin)
  window.publishPost = async function() {
    if (!currentUser || currentUser.uid !== ADMIN_UID) return;

    const title = document.getElementById('post-title').value.trim();
    const imgUrl = document.getElementById('post-img-url').value.trim();
    const text = document.getElementById('post-text').value.trim();

    if (!title || !text) {
      alert("Inserisci almeno titolo e testo!");
      return;
    }

    try {
      await addDoc(collection(db, "annunci"), {
        titolo: title,
        immagine: imgUrl || null,
        testo: text,
        autore: "Fronte ★",
        timestamp: new Date(),
        likes: []
      });

      document.getElementById('post-title').value = "";
      document.getElementById('post-img-url').value = "";
      document.getElementById('post-text').value = "";
      alert("Pubblicato con successo!");
    } catch (e) {
      alert("Errore: " + e.message);
    }
  };

  // Gestione Like Persistenti
  window.toggleLike = async function(postId) {
    if (!currentUser) {
      alert("Devi effettuare l'accesso per mettere Mi piace!");
      openModal('login');
      return;
    }

    const postRef = doc(db, "annunci", postId);
    // Recupera lo stato attuale del post o usa un controllo rapido
    // Per semplicità verifichiamo direttamente su Firestore con un update atomico
    // In alternativa, controlliamo se l'utente ha già messo like salvandolo nell'array 'likes'
    try {
      // Semplificazione: gestiamo l'aggiunta/rimozione tramite arrayUnion / arrayRemove
      // Per farlo in modo pulito con il click del bottone:
      // Verifichiamo se il bottone ha la classe liked
      const btn = document.getElementById(`like-btn-${postId}`);
      const isLiked = btn.classList.contains("liked");

      if (isLiked) {
        await updateDoc(postRef, {
          likes: arrayRemove(currentUser.uid)
        });
      } else {
        await updateDoc(postRef, {
          likes: arrayUnion(currentUser.uid)
        });
      }
    } catch (e) {
      console.error("Errore like:", e);
    }
  };

  // Caricamento Post in tempo reale
  function loadPosts() {
    const q = query(collection(db, "annunci"), orderBy("timestamp", "desc"));

    onSnapshot(q, (snapshot) => {
      const container = document.getElementById('posts-container');
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = "<p style='text-align: center; color: #bcd9f7;'>Nessun annuncio presente.</p>";
        return;
      }

      snapshot.docs.forEach((docSnap) => {
        const data = docSnap.data();
        const postId = docSnap.id;
        
        let dateStr = "Di recente";
        if (data.timestamp) {
          const d = data.timestamp.toDate();
          dateStr = `Pubblicato il ${d.toLocaleDateString('it-IT')} alle ${d.toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'})}`;
        }

        const likesArray = data.likes || [];
        const userHasLiked = currentUser && likesArray.includes(currentUser.uid);
        const likeCount = likesArray.length;

        const article = document.createElement('article');
        article.className = 'glass';

        let imgHTML = data.immagine ? `<img src="${data.immagine}" alt="${data.titolo}" class="post-img">` : '';
        const paragraphs = data.testo.split('\n').map(p => `<p>${p}</p>`).join('');

        article.innerHTML = `
          <h2>${data.titolo}</h2>
          <span class="post-info">${dateStr} da <strong>${data.autore || 'Fronte ★'}</strong></span>
          ${imgHTML}
          ${paragraphs}
          <div>
            <button id="like-btn-${postId}" class="btn btn-like ${userHasLiked ? 'liked' : ''}" onclick="toggleLike('${postId}')">
              👍 Mi piace <span style="font-size: 0.9rem; opacity: 0.9;">(${likeCount})</span>
            </button>
          </div>
        `;

        container.appendChild(article);
      });
    });
  }

  loadPosts();
</script>
</body>
</html>
