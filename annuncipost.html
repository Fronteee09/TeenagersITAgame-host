<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annunci e Post - TeenagersITA</title>
<link rel="icon" href="teenagersitalogo2.png">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #dbeafe;
    line-height: 1.6;
    overflow-x: hidden;
    background-color: #07152b;
    background-image: linear-gradient(rgba(3, 10, 22, 0.75), rgba(7, 21, 43, 0.85)), url('sfondo2.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px; }

  .glass {
    background: linear-gradient(180deg, rgba(120,190,255,.22), rgba(20,50,95,.35));
    border: 1px solid rgba(140,200,255,.45);
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.6), inset 0 1px 0 rgba(200,230,255,.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    padding: 20px;
    margin-bottom: 18px;
  }

  header.glass { margin-top: 24px; text-align: center; padding: 36px 20px; }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(1.8rem, 7vw, 2.8rem);
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 0 14px rgba(90,180,255,.9), 0 2px 4px rgba(0,0,0,.8);
  }
  header p { margin: 0 0 22px; color: #bcd9f7; font-size: 1.1rem; }

  .header-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-block;
    min-height: 48px;
    padding: 12px 28px;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0,20,60,.9);
    border: 1px solid #6cc0ff;
    border-radius: 999px;
    background: linear-gradient(180deg, #5cc0ff 0%, #1f7fd8 50%, #0d56ad 51%, #2a96e8 100%);
    box-shadow: 0 0 16px rgba(80,170,255,.6), inset 0 1px 0 rgba(255,255,255,.7);
    cursor: pointer;
    font-size: 0.95rem;
  }

  .btn:active { filter: brightness(.9); }

  .btn-like {
    min-height: 40px;
    padding: 8px 16px;
    font-size: 1.1rem;
    margin-top: 10px;
    background: linear-gradient(180deg, rgba(80,160,255,0.4) 0%, rgba(20,60,120,0.6) 100%);
    border: 1px solid rgba(140,200,255,0.5);
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-like.liked {
    background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    border-color: #60a5fa;
    box-shadow: 0 0 16px rgba(59,130,246,0.6), inset 0 1px 0 rgba(255,255,255,0.7);
  }

  h2 { margin: 0 0 4px; font-size: 1.4rem; color: #fff; text-shadow: 0 0 8px rgba(90,180,255,.6); }
  .post-info { font-size: 0.85rem; color: #8fb4dc; margin-bottom: 12px; display: block; }
  p { margin: 0 0 10px; color: #bcd9f7; }

  footer { text-align: center; color: #8fb4dc; font-size: .9rem; padding: 10px 0 40px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="glass">
    <h1>Annunci e Post</h1>
    <p>Tutti gli aggiornamenti sul progetto TeenagersITA</p>
    <div class="header-buttons">
      <a class="btn" href="index.html">Torna alla Home</a>
    </div>
  </header>

  <!-- POSTS CONTAINER -->
  <div id="posts-container">
    
    <!-- Post Alpha 1.0 -->
    <article class="glass">
      <h2>Alpha 1.0</h2>
      <span class="post-info">Pubblicato il 15/10/2026 da <strong>Fronte ★</strong></span>
      <p>Aggiunti i livelli e inizio del gioco</p>
      <div>
        <button id="like-btn-alpha-1-0" class="btn btn-like" onclick="toggleLike('alpha-1-0')">
          👍 Mi piace <span id="like-count-alpha-1-0" style="font-size: 0.9rem; opacity: 0.9;">(0)</span>
        </button>
      </div>
    </article>

    <!-- Post Indev 0.9 -->
    <article class="glass">
      <h2>Indev 0.9</h2>
      <span class="post-info">Pubblicato il 10/10/2026 da <strong>Fronte ★</strong></span>
      <p>Aggiunto local storage</p>
      <div>
        <button id="like-btn-indev-0-9" class="btn btn-like" onclick="toggleLike('indev-0-9')">
          👍 Mi piace <span id="like-count-indev-0-9" style="font-size: 0.9rem; opacity: 0.9;">(0)</span>
        </button>
      </div>
    </article>

  </div>

  <footer>Carte TeenagersITA · Progetto NON ufficiale</footer>

</div>

<script>
  // Gestione Like locale (salvata nel browser in modo sicuro e senza errori)
  function updateLikesUI() {
    const likesData = JSON.parse(localStorage.getItem('teenagersita_likes') || '{}');
    
    ['alpha-1-0', 'indev-0-9'].forEach(postId => {
      const count = likesData[postId] || 0;
      const isLiked = localStorage.getItem('liked_' + postId) === 'true';
      
      const btn = document.getElementById('like-btn-' + postId);
      const countSpan = document.getElementById('like-count-' + postId);
      
      if (countSpan) countSpan.innerText = '(' + count + ')';
      if (btn) {
        if (isLiked) {
          btn.classList.add('liked');
        } else {
          btn.classList.remove('liked');
        }
      }
    });
  }

  window.toggleLike = function(postId) {
    let likesData = JSON.parse(localStorage.getItem('teenagersita_likes') || '{}');
    let isLiked = localStorage.getItem('liked_' + postId) === 'true';
    
    if (!likesData[postId]) likesData[postId] = 0;

    if (isLiked) {
      likesData[postId] = Math.max(0, likesData[postId] - 1);
      localStorage.setItem('liked_' + postId, 'false');
    } else {
      likesData[postId] += 1;
      localStorage.setItem('liked_' + postId, 'true');
    }

    localStorage.setItem('teenagersita_likes', JSON.stringify(likesData));
    updateLikesUI();
  };

  // Caricamento iniziale dello stato dei like
  updateLikesUI();
</script>
</body>
</html>
